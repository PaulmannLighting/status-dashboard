<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Service Status Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:ital,wght@0,300;0,400;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light dark;

      /* DARK */
      --bg:         #0d0d0f;
      --surface:    #141416;
      --surface2:   #1c1c1f;
      --border:     #2a2a2e;
      --text:       #e8e8ec;
      --text2:      #a0a0aa;
      --muted:      #6b6b75;
      --brand:      #970437;

      --green:  #22c55e; --green-bg:  rgba(34,197,94,0.10);  --green-bd:  rgba(34,197,94,0.20);
      --yellow: #eab308; --yellow-bg: rgba(234,179,8,0.10);  --yellow-bd: rgba(234,179,8,0.25);
      --red:    #ef4444; --red-bg:    rgba(239,68,68,0.10);  --red-bd:    rgba(239,68,68,0.25);
      --blue:   #3b82f6; --blue-bg:   rgba(59,130,246,0.10); --blue-bd:   rgba(59,130,246,0.25);
      --gray-bg: rgba(107,107,117,0.10); --gray-bd: rgba(107,107,117,0.20);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg:       #f4f4f6;
        --surface:  #ffffff;
        --surface2: #f0f0f3;
        --border:   #e0e0e6;
        --text:     #111114;
        --text2:    #444450;
        --muted:    #888896;

        --green-bg:  rgba(34,197,94,0.08);  --green-bd:  rgba(34,197,94,0.25);
        --yellow-bg: rgba(234,179,8,0.08);  --yellow-bd: rgba(234,179,8,0.30);
        --red-bg:    rgba(239,68,68,0.08);  --red-bd:    rgba(239,68,68,0.30);
        --blue-bg:   rgba(59,130,246,0.08); --blue-bd:   rgba(59,130,246,0.30);
        --gray-bg:   rgba(107,107,117,0.08); --gray-bd:  rgba(107,107,117,0.25);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      min-height: 100vh;
      padding: 2rem;
      transition: background 0.2s, color 0.2s;
    }

    .wrapper { max-width: 1100px; margin: 0 auto; }

    /* HEADER */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .logo-area h1 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--brand);
    }

    .logo-area p {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.2rem;
      font-family: 'DM Mono', monospace;
    }

    #last-updated {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: right;
    }

    /* OVERALL BANNER */
    #overall-banner {
      border-radius: 8px;
      padding: 0.9rem 1.25rem;
      margin-bottom: 1.75rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 600;
      font-size: 0.88rem;
      border: 1px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    #overall-banner .dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* PROVIDER CARDS — full width stack */
    #providers-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .provider-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      animation: fadeIn 0.35s ease both;
      transition: border-color 0.2s;
    }

    .provider-card:hover { border-color: var(--muted); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Card top bar — colored by status */
    .card-topbar {
      height: 3px;
      width: 100%;
    }

    .bar-operational { background: var(--green); }
    .bar-degraded    { background: var(--yellow); }
    .bar-outage      { background: var(--red); }
    .bar-maintenance { background: var(--blue); }
    .bar-unknown     { background: var(--border); }

    /* Card main row */
    .card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.1rem 1.4rem 0.9rem;
      gap: 1rem;
      cursor: pointer;
      user-select: none;
    }

    .card-left { display: flex; align-items: center; gap: 1rem; flex: 1; }

    .provider-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .card-meta-inline {
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
    }

    .card-meta-inline a { color: var(--muted); text-decoration: none; }
    .card-meta-inline a:hover { color: var(--text); }

    .card-right { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }

    .status-badge {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      font-weight: 500;
      padding: 0.22rem 0.65rem;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      border: 1px solid transparent;
    }

    .badge-operational { background: var(--green-bg);  color: var(--green);  border-color: var(--green-bd); }
    .badge-degraded    { background: var(--yellow-bg); color: var(--yellow); border-color: var(--yellow-bd); }
    .badge-outage      { background: var(--red-bg);    color: var(--red);    border-color: var(--red-bd); }
    .badge-maintenance { background: var(--blue-bg);   color: var(--blue);   border-color: var(--blue-bd); }
    .badge-unknown     { background: var(--gray-bg);   color: var(--muted);  border-color: var(--gray-bd); }

    .checked-time {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      color: var(--muted);
      white-space: nowrap;
    }

    .toggle-icon {
      color: var(--muted);
      font-size: 0.7rem;
      transition: transform 0.2s;
      width: 16px;
      text-align: center;
    }

    .provider-card.open .toggle-icon { transform: rotate(180deg); }

    /* DETAILS PANEL */
    .card-details {
      display: none;
      border-top: 1px solid var(--border);
      padding: 1rem 1.4rem 1.25rem;
      background: var(--surface2);
    }

    .provider-card.open .card-details { display: block; }

    .details-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .incident-list { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }

    .incident-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.7rem 0.9rem;
    }

    .incident-title {
      font-size: 0.82rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .incident-title a {
      color: var(--text);
      text-decoration: none;
      flex: 1;
    }
    .incident-title a:hover { color: var(--brand); }

    .incident-date {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .incident-body {
      font-size: 0.78rem;
      color: var(--text2);
      line-height: 1.55;
    }

    .no-incidents {
      font-size: 0.8rem;
      color: var(--muted);
      font-style: italic;
    }

    /* LOADING / ERROR */
    #loading, #error-msg {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.82rem;
    }
    #error-msg { color: var(--red); }

    .spinner {
      width: 26px; height: 26px;
      border: 2px solid var(--border);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* FOOTER */
    footer {
      margin-top: 2.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
<div class="wrapper">

  <header>
    <div class="logo-area">
      <h1>Service Status</h1>
      <p>Third-Party Provider Monitoring</p>
    </div>
    <div id="last-updated">Lade Daten…</div>
  </header>

  <div id="overall-banner">
    <div class="dot" id="overall-dot"></div>
    <span id="overall-text">Prüfe Status…</span>
  </div>

  <div id="loading"><div class="spinner"></div>Lade status.json…</div>
  <div id="error-msg" style="display:none"></div>
  <div id="providers-grid" style="display:none"></div>

  <footer>
    <span>Paulmann Licht GmbH · Internal Dashboard</span>
    <span>Daten via n8n · Refresh alle 10 Min</span>
  </footer>

</div>
<script>
  const STATUS_JSON_URL = './status.json';

  const STATUS_META = {
    operational:  { label: 'Operational',  badge: 'badge-operational',  bar: 'bar-operational',  color: '#22c55e', bannerBg: 'rgba(34,197,94,0.07)',  bannerBd: 'rgba(34,197,94,0.18)'  },
    degraded:     { label: 'Degraded',     badge: 'badge-degraded',     bar: 'bar-degraded',     color: '#eab308', bannerBg: 'rgba(234,179,8,0.08)',   bannerBd: 'rgba(234,179,8,0.22)'  },
    outage:       { label: 'Outage',       badge: 'badge-outage',       bar: 'bar-outage',       color: '#ef4444', bannerBg: 'rgba(239,68,68,0.08)',   bannerBd: 'rgba(239,68,68,0.22)'  },
    maintenance:  { label: 'Maintenance',  badge: 'badge-maintenance',  bar: 'bar-maintenance',  color: '#3b82f6', bannerBg: 'rgba(59,130,246,0.08)',  bannerBd: 'rgba(59,130,246,0.22)' },
    unknown:      { label: 'Unknown',      badge: 'badge-unknown',      bar: 'bar-unknown',      color: '#6b6b75', bannerBg: 'rgba(107,107,117,0.07)', bannerBd: 'rgba(107,107,117,0.18)'},
  };

  function getMeta(s) { return STATUS_META[s] || STATUS_META.unknown; }

  function overallStatus(providers) {
    for (const s of ['outage','degraded','maintenance','operational','unknown']) {
      if (providers.some(p => p.status === s)) return s;
    }
    return 'unknown';
  }

  function fmtDate(iso) {
    if (!iso) return '';
    try { return new Date(iso).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }); }
    catch { return iso; }
  }

  function renderDashboard(data) {
    document.getElementById('loading').style.display = 'none';
    const grid = document.getElementById('providers-grid');
    grid.style.display = 'flex';

    document.getElementById('last-updated').textContent =
      'Zuletzt aktualisiert: ' + fmtDate(data.updated_at);

    // Banner
    const overall = overallStatus(data.providers);
    const om = getMeta(overall);
    const banner = document.getElementById('overall-banner');
    banner.style.background = om.bannerBg;
    banner.style.borderColor = om.bannerBd;
    document.getElementById('overall-dot').style.background = om.color;
    document.getElementById('overall-text').textContent =
      overall === 'operational'  ? 'Alle Systeme funktionieren normal.' :
      overall === 'outage'       ? 'Mindestens ein Anbieter meldet einen Ausfall!' :
      overall === 'degraded'     ? 'Mindestens ein Anbieter meldet eingeschränkten Betrieb.' :
      overall === 'maintenance'  ? 'Wartungsarbeiten bei einem oder mehreren Anbietern.' :
                                   'Status unbekannt – Daten werden geprüft.';

    // Cards
    grid.innerHTML = '';
    data.providers.forEach((p, i) => {
      const m = getMeta(p.status);
      const card = document.createElement('div');
      card.className = 'provider-card';
      card.style.animationDelay = `${i * 50}ms`;

      // Recent incidents HTML
      const incidents = p.recent_incidents || [];
      let incidentsHtml = '';
      if (incidents.length === 0) {
        incidentsHtml = '<p class="no-incidents">Keine aktuellen Meldungen im RSS-Feed.</p>';
      } else {
        incidentsHtml = '<ul class="incident-list">' + incidents.map(inc => `
          <li class="incident-item">
            <div class="incident-title">
              ${inc.link ? `<a href="${inc.link}" target="_blank" rel="noopener">${inc.title || '(kein Titel)'}</a>` : `<span>${inc.title || '(kein Titel)'}</span>`}
              ${inc.date ? `<span class="incident-date">${fmtDate(inc.date)}</span>` : ''}
            </div>
            ${inc.body ? `<div class="incident-body">${inc.body.substring(0, 280)}${inc.body.length > 280 ? '…' : ''}</div>` : ''}
          </li>`).join('') + '</ul>';
      }

      card.innerHTML = `
        <div class="card-topbar ${m.bar}"></div>
        <div class="card-main" onclick="this.closest('.provider-card').classList.toggle('open')">
          <div class="card-left">
            <div>
              <div class="provider-name">${p.name}</div>
              <div class="card-meta-inline">
                <a href="${p.status_url}" target="_blank" rel="noopener">${p.status_url.replace('https://', '')}</a>
              </div>
            </div>
          </div>
          <div class="card-right">
            <span class="checked-time">${p.checked_at ? fmtDate(p.checked_at) : ''}</span>
            <span class="status-badge ${m.badge}">${m.label}</span>
            <span class="toggle-icon">▼</span>
          </div>
        </div>
        <div class="card-details">
          <div class="details-label">Letzte RSS-Einträge (${incidents.length})</div>
          ${incidentsHtml}
        </div>`;

      grid.appendChild(card);
    });
  }

  function showError(msg) {
    document.getElementById('loading').style.display = 'none';
    const el = document.getElementById('error-msg');
    el.style.display = 'block';
    el.textContent = '⚠ ' + msg;
  }

  async function load() {
    try {
      const res = await fetch(STATUS_JSON_URL + '?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      renderDashboard(await res.json());
    } catch (e) {
      showError('status.json konnte nicht geladen werden: ' + e.message);
    }
  }

  load();
  setInterval(load, 10 * 60 * 1000);
</script>
</body>
</html>
